name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  major-tag:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Move major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # vX.Y.Z moves vX (created on the first vX release), pre-releases move nothing
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is a pre-release, leaving major tags alone"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"

          # A hotfix tagged on an older minor mustn't pull the major tag back
          latest=$(git tag -l "$major.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$latest" != "$TAG" ]; then
            echo "$latest is newer than $TAG, leaving $major alone"
            exit 0
          fi

          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $TAG"
