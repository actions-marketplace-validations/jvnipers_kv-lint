name: kv-lint
description: Lint Valve KeyValues files, with rules for Sourcemod style translation phrase and menu files
branding:
  color: "purple"
  icon: "aperture"
inputs:
  config:
    description: Config file, globs in it are relative to its directory (default kv-lint.toml)
    default: ""
  files:
    description: Space-separated globs to check with the generic checks only, instead of the config
    default: ""
  phrases:
    description: Space-separated globs to check with the phrases rules, instead of the config
    default: ""
  phrases-style:
    description: How phrases files are checked, sourcemod (default) or mm-utils
    default: ""
  radiopanel:
    description: Space-separated globs to check with the radiopanel rules, instead of the config
    default: ""
  gamedata:
    description: Space-separated globs to check with the gamedata rules, instead of the config
    default: ""
  gamedata-style:
    description: How gamedata files are checked, sourcemod (default) or ida
    default: ""
  languages:
    description: Languages file for phrases/radiopanel, instead of the config
    default: ""
  report:
    description: Missing translations report file, instead of the config
    default: ""
  json:
    description: Missing translations JSON report file, instead of the config
    default: ""
  markdown:
    description: Translations summary markdown file, instead of the config
    default: ""
  checks:
    description: Space-separated ID=SEVERITY overrides
    default: ""
  output:
    description: File to write the issues to, only created when there are any
    default: ""
runs:
  using: composite
  steps:
    # setup-python only has builds for GitHub's images, so self-hosted runners use their own Python.
    - id: python
      shell: bash
      run: |
        for py in python3 python; do
          if "$py" -c 'import sys; sys.exit(sys.version_info < (3, 11))' 2>/dev/null; then
            echo "bin=$py" >> "$GITHUB_OUTPUT"
            break
          fi
        done
    - if: steps.python.outputs.bin == ''
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    # Inputs go through env so they never get spliced into the script.
    # set -f keeps bash from expanding the globs; kv-lint does that itself.
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        KV_LINT_PYTHON: ${{ steps.python.outputs.bin || 'python' }}
        KV_LINT_CONFIG: ${{ inputs.config }}
        KV_LINT_FILES: ${{ inputs.files }}
        KV_LINT_PHRASES: ${{ inputs.phrases }}
        KV_LINT_PHRASES_STYLE: ${{ inputs.phrases-style }}
        KV_LINT_RADIOPANEL: ${{ inputs.radiopanel }}
        KV_LINT_GAMEDATA: ${{ inputs.gamedata }}
        KV_LINT_GAMEDATA_STYLE: ${{ inputs.gamedata-style }}
        KV_LINT_LANGUAGES: ${{ inputs.languages }}
        KV_LINT_REPORT: ${{ inputs.report }}
        KV_LINT_JSON: ${{ inputs.json }}
        KV_LINT_MARKDOWN: ${{ inputs.markdown }}
        KV_LINT_CHECKS: ${{ inputs.checks }}
        KV_LINT_OUTPUT: ${{ inputs.output }}
      run: |
        set -f
        args=()
        for check in $KV_LINT_CHECKS; do args+=(--check "$check"); done
        for glob in $KV_LINT_PHRASES; do args+=(--phrases "$glob"); done
        for glob in $KV_LINT_RADIOPANEL; do args+=(--radiopanel "$glob"); done
        for glob in $KV_LINT_GAMEDATA; do args+=(--gamedata "$glob"); done
        if [ -n "$KV_LINT_GAMEDATA_STYLE" ]; then args+=(--gamedata-style "$KV_LINT_GAMEDATA_STYLE"); fi
        if [ -n "$KV_LINT_LANGUAGES" ]; then args+=(--languages "$KV_LINT_LANGUAGES"); fi
        if [ -n "$KV_LINT_REPORT" ]; then args+=(--report "$KV_LINT_REPORT"); fi
        if [ -n "$KV_LINT_JSON" ]; then args+=(--json "$KV_LINT_JSON"); fi
        if [ -n "$KV_LINT_MARKDOWN" ]; then args+=(--markdown "$KV_LINT_MARKDOWN"); fi
        if [ -n "$KV_LINT_PHRASES_STYLE" ]; then args+=(--phrases-style "$KV_LINT_PHRASES_STYLE"); fi
        if [ -n "$KV_LINT_CONFIG" ]; then args+=(--config "$KV_LINT_CONFIG"); fi
        if [ -n "$KV_LINT_OUTPUT" ]; then args+=(--output "$KV_LINT_OUTPUT"); fi
        "$KV_LINT_PYTHON" -m kv_lint "${args[@]}" $KV_LINT_FILES
